<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神経衰弱スコアボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}
/* Layout: one-thumb court console — team strip on top, big timer, a 2×2 pad of action buttons, scoreboard below */
:root {
  --bg: #eef1ee; --panel: #ffffff; --ink: #14201b; --muted: #5d6b64; --line: #cfd8d2;
  --court: #1f6f4a; --court-ink: #ffffff; --away: #2f4b8f; --warn: #c2410c; --dbl: #b7791f;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --font-num: 'Barlow Condensed', 'Zen Kaku Gothic New', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1613; --panel: #18221d; --ink: #e8efea; --muted: #94a39b; --line: #2b3a33;
  --court: #2f9a68; --court-ink: #06110c; --away: #6f8fe0; --warn: #f97316; --dbl: #e0a83a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1613; --panel: #18221d; --ink: #e8efea; --muted: #94a39b; --line: #2b3a33;
  --court: #2f9a68; --court-ink: #06110c; --away: #6f8fe0; --warn: #f97316; --dbl: #e0a83a; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap > * { min-width: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; font-weight: 900; letter-spacing: .02em; text-wrap: balance; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; padding-inline: 10px !important; background: transparent; color: var(--muted); font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--court); color: var(--court-ink); }
.card { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
label.sel { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
select, input[type=number] { font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
button { font-family: var(--font-body); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--dbl); outline-offset: 2px; }
.turn { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.turnteam { font-size: 26px; font-weight: 900; }
.turnteam small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
.badge { font-size: 12px; font-weight: 900; padding: 4px 8px; border-radius: 999px; border: 2px solid var(--dbl); color: var(--dbl); }
.timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: clamp(72px, 26vw, 128px); line-height: 1; text-align: center; font-weight: 700; letter-spacing: .02em; }
.timer.over { color: var(--warn); }
.status { text-align: center; font-weight: 700; color: var(--muted); min-height: 1.4em; }
.status.alert { color: var(--warn); }
.pad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pad button, .big { border: 0; border-radius: 12px; padding: 16px 8px; font-size: 18px; font-weight: 900; cursor: pointer; min-height: 64px; }
.pad .pair { background: var(--court); color: var(--court-ink); }
.pad .clear { background: var(--away); color: #fff; }
.pad .end { background: var(--ink); color: var(--bg); }
.pad .give { background: transparent; color: var(--warn); border: 2px solid var(--warn); }
.pad button:disabled { opacity: .35; cursor: not-allowed; }
.start { width: 100%; background: var(--court); color: var(--court-ink); font-size: 22px; }
.sub { display: flex; gap: 8px; flex-wrap: wrap; }
.sub button { flex: 1; min-width: 120px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 700; cursor: pointer; }
.sub button.on { border-color: var(--dbl); color: var(--dbl); background: transparent; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; }
td.pts { font-family: var(--font-num); font-size: 26px; font-weight: 700; }
tr.now td:first-child { color: var(--court); font-weight: 900; }
.log { font-size: 13px; color: var(--muted); max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.scroll { overflow-x: auto; }
.agg input { width: 48px; padding: 6px; font-size: 15px; text-align: right; }
.agg th, .agg td { white-space: nowrap; }
.rank td.r { font-family: var(--font-num); font-size: 22px; font-weight: 700; }
.tie { color: var(--warn); font-weight: 700; font-size: 12px; }
.confirm { display: flex; gap: 8px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-weight: 700; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--court); color: var(--court-ink); border-color: var(--court); }
.sets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sets button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-family: var(--font-num); font-size: 22px; font-weight: 700; padding: 8px 0; border-radius: 10px; cursor: pointer; }
.sets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ans { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ans:last-child { border-bottom: 0; }
.ans .lv { font-weight: 900; color: var(--muted); font-size: 13px; }
.ans .q { font-size: 13px; color: var(--muted); }
.ans .a { grid-column: 2; font-size: 26px; font-weight: 900; line-height: 1.25; }
.ans .n { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.5; }

.conn { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.conn.ok { color: var(--court); border-color: var(--court); }
.conn.ng { color: var(--warn); border-color: var(--warn); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--warn); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; max-width: calc(100% - 32px); z-index: 20; }
.pin { display: flex; gap: 8px; align-items: end; }
.pin input { font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>スポーツ神経衰弱　スコアボード</h1>
    <span class="conn" id="conn">接続中…</span>
    <div class="tabs" role="tablist">
      <button id="tab-gm" role="tab" aria-selected="true">GM用</button>
      <button id="tab-agg" role="tab" aria-selected="false">集計用</button>
    </div>
  </header>

  <!-- ===== GM ===== -->
  <section id="view-gm" class="wrap" style="gap:12px;width:100%">
    <div class="card row">
      <label class="sel">試合<select id="game"><option value="1">第1試合</option><option value="2">第2試合</option></select></label>
      <label class="sel">コート<select id="court"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
      <label class="sel">先攻（じゃんけんの勝ち）<select id="first"></select></label>
    </div>
    <div class="card pin" id="pinrow">
      <label class="sel">GM用PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
      <button class="big" id="pinbtn" style="min-height:44px;padding:8px 16px;background:var(--court);color:var(--court-ink)">確認</button>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="turn">
        <div class="turnteam" id="turnteam"></div>
        <span class="badge" id="dblbadge" hidden>お題2倍</span>
      </div>
      <div class="timer" id="timer">3:00</div>
      <div class="status" id="status">「スタート」でこのチームの持ち時間3分が始まります</div>
      <button class="big start" id="startbtn">スタート</button>
      <div class="pad" id="pad" hidden>
        <button class="pair" id="pairbtn">ペア成立<br>＋3</button>
        <button class="clear" id="clearbtn">お題クリア<br><span id="clearpts">＋1</span></button>
        <button class="give" id="givebtn" disabled>ギブアップ<br><span style="font-size:12px">2分経過後</span></button>
        <button class="end" id="endbtn">ターン終了<br><span style="font-size:12px">相手の番へ</span></button>
      </div>
      <div class="sub">
        <button id="undobtn">直前の操作を取り消す</button>
        <button id="last6btn">残り6分の合図を出した</button>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>チーム</th><th>得点</th><th>クリア数</th><th>ペア数</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
      <div class="log" id="log" style="margin-top:8px"></div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="note">全体のタイマーで21分の笛が鳴ったら「試合終了」を押してください。進行中のターンは打ち切りで、挑戦中のお題は0点です。結果を集計係に見せたら「リセット」で次の試合の準備をします。</div>
      <div class="sub">
        <button id="finishbtn">試合終了</button>
        <button id="resetbtn">リセット</button>
      </div>
      <div class="confirm" id="resetconfirm" hidden>
        <span class="note" style="flex:1">このコートの記録をすべて消します。</span>
        <button class="big" id="resetyes" style="min-height:40px;padding:8px 14px;background:var(--warn);color:#fff">消す</button>
        <button class="big" id="resetno" style="min-height:40px;padding:8px 14px;background:var(--line);color:var(--ink)">やめる</button>
      </div>
    </div>
  </section>

  <!-- ===== 集計 ===== -->
  <section id="view-agg" class="wrap" hidden style="gap:12px;width:100%">
    <div class="card note">4コートのGMが押した点数が、自動で集まります。順位は「合計得点 → クリア数 → ペア数」の順に決まり、それでも同じならじゃんけんです。</div>
    <div class="card">
      <table class="rank">
        <thead><tr><th>順位</th><th>チーム</th><th>第1試合</th><th>第2試合</th><th>合計</th><th>クリア</th><th>ペア</th></tr></thead>
        <tbody id="rankbody"></tbody>
      </table>
    </div>
    <div class="card scroll">
      <table>
        <thead><tr><th>試合・コート</th><th>チーム</th><th>得点</th><th>クリア</th><th>ペア</th></tr></thead>
        <tbody id="courtbody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://evxvzpdyorkemwkctjlw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aYGAvi6ozpUNFC1ePgBchw_xE3Wr3Mz';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const MATCH = { 1: { A: [1, 2], B: [3, 4], C: [5, 6], D: [7, 8] }, 2: { A: [5, 8], B: [6, 7], C: [1, 4], D: [2, 3] } };
  const TURN = 180, GIVE_AFTER = 120;
  const $ = (id) => document.getElementById(id);
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // ローカルに残すのはタイマーと手番だけ。得点はデータベース。
  let S = load('gm2', null) || { game: 1, court: 'A', first: null, turnTeam: null, start: null, dbl: false, last6: false, finished: false };
  let PIN = load('pin', '');
  let EV = [];          // このコート・試合の記録
  let RESULTS = [];     // 集計ビュー
  let ALLEV = [];       // 全コートの記録（集計用）

  const teams = () => MATCH[S.game][S.court];
  const persist = () => save('gm2', S);
  const other = (t) => { const [a, b] = teams(); return t === a ? b : a; };

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3500); }
  function setConn(ok, text) { const c = $('conn'); c.className = 'conn ' + (ok ? 'ok' : 'ng'); c.textContent = text; }

  let firstKey = '';
  function fillFirst() {
    const [a, b] = teams();
    if (firstKey !== a + '-' + b) { firstKey = a + '-' + b;
      $('first').innerHTML = `<option value="${a}">チーム${a}</option><option value="${b}">チーム${b}</option>`; }
    if (![a, b].includes(S.first)) S.first = a;
    $('first').value = S.first;
    if (![a, b].includes(S.turnTeam)) S.turnTeam = S.first;
  }

  function tally() {
    const r = {}; teams().forEach((t) => (r[t] = { pts: 0, clears: 0, pairs: 0 }));
    EV.forEach((e) => { if (!r[e.team]) return; r[e.team].pts += e.points; if (e.kind === 'pair') r[e.team].pairs++; else r[e.team].clears++; });
    return r;
  }
  const elapsed = () => (S.start ? (Date.now() - S.start) / 1000 : 0);
  const fmt = (sec) => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

  let beeped = false, actx = null;
  function beep() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach((t) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.3); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.3); });
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  }

  function render() {
    $('game').value = S.game; $('court').value = S.court; fillFirst();
    $('pinrow').hidden = !!PIN;
    const running = !!S.start && !S.finished;
    $('turnteam').innerHTML = S.finished ? '<small>試合終了</small>おつかれさまでした' : `<small>いまのターン</small>チーム${S.turnTeam}`;
    $('dblbadge').hidden = !(running && S.dbl);
    $('startbtn').hidden = running || S.finished;
    $('startbtn').disabled = !PIN;
    $('pad').hidden = !running;
    $('clearpts').textContent = S.dbl ? '＋2（2倍）' : '＋1';
    const el = elapsed();
    $('timer').textContent = running ? fmt(TURN - el) : '3:00';
    $('timer').classList.toggle('over', running && el >= TURN);
    $('givebtn').disabled = !(running && el >= GIVE_AFTER);
    const st = $('status'); st.classList.remove('alert');
    if (!PIN) st.textContent = '最初にGM用PINを入れてください';
    else if (S.finished) st.textContent = '試合終了。得点は自動で集計されています';
    else if (running && el >= TURN) { st.textContent = '時間切れ。挑戦中のお題は0点です。「ターン終了」を押してください'; st.classList.add('alert'); }
    else if (running) st.textContent = el >= GIVE_AFTER ? 'ギブアップできます' : 'ペアがそろったら「ペア成立」、お題をクリアしたら「お題クリア」';
    else st.textContent = S.last6 ? '残り6分を過ぎたので、次のターンからお題の点が2倍です' : '「スタート」でこのチームの持ち時間3分が始まります';
    $('last6btn').classList.toggle('on', S.last6);
    $('last6btn').textContent = S.last6 ? '残り6分：合図済み（次のターンから2倍）' : '残り6分の合図を出した';
    const r = tally();
    $('board').innerHTML = teams().map((t) => `<tr class="${t === S.turnTeam && !S.finished ? 'now' : ''}"><td>チーム${t}</td><td class="pts">${r[t].pts}</td><td>${r[t].clears}</td><td>${r[t].pairs}</td></tr>`).join('');
    $('log').innerHTML = EV.slice().reverse().slice(0, 30).map((e) =>
      `<div>${new Date(e.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}　チーム${e.team}：${e.kind === 'pair' ? 'ペア成立' : 'お題クリア'} ＋${e.points}${e.doubled ? '（2倍）' : ''}</div>`).join('') || '<div>まだ記録はありません</div>';
  }

  setInterval(() => { if (S.start && !S.finished) { if (elapsed() >= TURN && !beeped) { beeped = true; beep(); } render(); } }, 250);

  let wake = null;
  async function keepAwake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => (wake = null)); } } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refresh(); } });

  // ===== データベース =====
  async function refresh() {
    const [a, b] = await Promise.all([
      db.from('events').select('*').order('id'),
      db.from('team_results').select('*'),
    ]);
    if (a.error || b.error) { setConn(false, '未接続'); return; }
    setConn(true, '接続中');
    ALLEV = a.data; RESULTS = b.data;
    EV = ALLEV.filter((e) => e.game === S.game && e.court === S.court);
    render(); rank();
  }
  async function call(fn, args) {
    const { data, error } = await db.rpc(fn, { p_pin: PIN, ...args });
    if (error) {
      if (/PIN/.test(error.message)) { PIN = ''; save('pin', ''); render(); toast('PINが違います。入れ直してください'); }
      else toast('送れませんでした。電波を確認して、もう一度押してください');
      return null;
    }
    await refresh();
    return data;
  }
  let busy = false;
  async function addEvent(kind) {
    if (busy) return; busy = true;
    await call('add_event', { p_game: S.game, p_court: S.court, p_team: S.turnTeam, p_kind: kind, p_doubled: S.dbl });
    busy = false;
  }

  $('pinbtn').onclick = async () => {
    const p = $('pin').value.trim(); if (!p) return;
    const { data, error } = await db.rpc('check_pin', { p_pin: p });
    if (error) { toast('確認できませんでした。電波を確認してください'); return; }
    if (!data) { toast('PINが違います'); return; }
    PIN = p; save('pin', p); $('pin').value = ''; render();
  };
  $('startbtn').onclick = () => { S.start = Date.now(); S.dbl = S.last6; beeped = false; keepAwake();
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} persist(); render(); };
  $('pairbtn').onclick = () => addEvent('pair');
  $('clearbtn').onclick = () => addEvent('clear');
  function endTurn() { S.start = null; S.turnTeam = other(S.turnTeam); persist(); render(); }
  $('endbtn').onclick = endTurn;
  $('givebtn').onclick = endTurn;
  $('undobtn').onclick = () => call('undo_last', { p_game: S.game, p_court: S.court });
  $('last6btn').onclick = () => { S.last6 = !S.last6; persist(); render(); };
  $('finishbtn').onclick = () => { S.start = null; S.finished = true; persist(); render(); };
  $('resetbtn').onclick = () => { $('resetconfirm').hidden = false; };
  $('resetno').onclick = () => { $('resetconfirm').hidden = true; };
  $('resetyes').onclick = async () => {
    $('resetconfirm').hidden = true;
    const n = await call('reset_court', { p_game: S.game, p_court: S.court });
    if (n === null) return;
    S = { game: S.game, court: S.court, first: null, turnTeam: null, start: null, dbl: false, last6: false, finished: false };
    persist(); render(); toast(`第${S.game}試合・コート${S.court}の記録を${n}件消しました`);
  };
  const changeMatch = () => { S.first = null; S.turnTeam = null; S.start = null; S.finished = false; S.last6 = false; persist(); EV = ALLEV.filter((e) => e.game === S.game && e.court === S.court); render(); };
  $('game').onchange = (e) => { S.game = +e.target.value; changeMatch(); };
  $('court').onchange = (e) => { S.court = e.target.value; changeMatch(); };
  $('first').onchange = (e) => { S.first = +e.target.value; if (!S.start && EV.length === 0) S.turnTeam = S.first; persist(); render(); };

  // ===== 集計 =====
  function rank() {
    const rows = RESULTS.slice().sort((a, b) => b.total - a.total || b.clears - a.clears || b.pairs - a.pairs || a.team - b.team);
    let place = 0;
    $('rankbody').innerHTML = rows.map((r, i) => {
      const same = (x) => x && x.total === r.total && x.clears === r.clears && x.pairs === r.pairs;
      if (!same(rows[i - 1])) place = i + 1;
      const tie = (same(rows[i - 1]) || same(rows[i + 1])) && (r.total || r.clears || r.pairs);
      return `<tr><td class="r">${place}</td><td>チーム${r.team}${tie ? ' <span class="tie">じゃんけん</span>' : ''}</td><td>${r.pts1}</td><td>${r.pts2}</td><td class="pts">${r.total}</td><td>${r.clears}</td><td>${r.pairs}</td></tr>`;
    }).join('');
    const out = [];
    [1, 2].forEach((g) => ['A', 'B', 'C', 'D'].forEach((c) => MATCH[g][c].forEach((t) => {
      const ev = ALLEV.filter((e) => e.game === g && e.court === c && e.team === t);
      out.push(`<tr><td>第${g}試合・${c}</td><td>チーム${t}</td><td>${ev.reduce((s, e) => s + e.points, 0)}</td><td>${ev.filter((e) => e.kind === 'clear').length}</td><td>${ev.filter((e) => e.kind === 'pair').length}</td></tr>`);
    })));
    $('courtbody').innerHTML = out.join('');
  }

  function show(which) {
    $('view-gm').hidden = which !== 'gm'; $('view-agg').hidden = which !== 'agg';
    $('tab-gm').setAttribute('aria-selected', which === 'gm'); $('tab-agg').setAttribute('aria-selected', which === 'agg');
    save('tab', which);
  }
  $('tab-gm').onclick = () => show('gm');
  $('tab-agg').onclick = () => show('agg');

  db.channel('events').on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => refresh()).subscribe();
  setInterval(refresh, 10000);   // リアルタイムが切れても10秒ごとに取り直す
  render(); refresh();
  show(location.hash === '#shukei' ? 'agg' : location.hash === '#gm' ? 'gm' : (load('tab', 'gm') === 'agg' ? 'agg' : 'gm'));
})();
</script>

</body>
</html>
